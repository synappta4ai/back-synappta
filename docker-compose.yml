version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapta
      POSTGRES_PASSWORD: synapta_pass
      POSTGRES_DB: synapta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapta"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: 9099
      DATABASE_URL: postgres://synapta:synapta_pass@db:5432/synapta?sslmode=disable
      URL_PUBLIC: http://localhost:9099
      JWT_SECRET: dev_only_jwt_secret_change_me
      ENCRYPTION_KEY: dev_only_32_byte_encryption_key!!
      SUPER_ADMIN_PASSWORD: superadmin_pass_123
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "9099:9099"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs

volumes:
  pgdata:
  uploads:
  outputs:
