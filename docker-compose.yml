version: "3.9"

services:
  api:
    build: .
    container_name: ${CONTAINER_NAME:-synapta-back-v0}
    environment:
      - APP_ENV=${APP_ENV}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - URL_PUBLIC=${URL_PUBLIC}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
      # Inference worker (modelos descargados) en el host:
      # gRPC + artifact server. Sin worker, el catálogo downloaded no aparece.
      - BM_WORKER_ADDR=${BM_WORKER_ADDR}
      - BM_WORKER_ARTIFACT_BASE=${BM_WORKER_ARTIFACT_BASE}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs

volumes:
  uploads:
  outputs:
